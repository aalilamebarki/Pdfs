name: Extract ZIP and Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p temp_extract

          unzip -q "$ZIP_FILE" -d temp_extract

          echo "ZIP extracted successfully."

      - name: Replace project files
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          echo "Cleaning project files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "temp_extract" \
            -exec rm -rf {} +

          echo "Detecting ZIP structure..."

          TOP_LEVEL_DIRS=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_LEVEL_FILES=$(find temp_extract -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$TOP_LEVEL_DIRS" -eq 1 ] && [ "$TOP_LEVEL_FILES" -eq 0 ]; then

            ROOT_DIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)

            echo "ZIP contains one root directory:"
            echo "$ROOT_DIR"

            cp -a "$ROOT_DIR"/. .

          else

            echo "ZIP contents are at root level."

            cp -a temp_extract/. .

          fi

          echo "Removing ZIP and temporary files..."

          rm -rf temp_extract
          rm -f "$ZIP_FILE"

      - name: Protect GitHub workflows
        shell: bash
        run: |
          set -e

          echo "Restoring existing GitHub workflow files..."

          git restore --source=HEAD -- .github/ || true

          echo "GitHub workflows protected."

      - name: Show final structure
        shell: bash
        run: |
          echo "Final repository structure:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort | head -300

      - name: Commit and Push changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Android project from ZIP"

          git push origin HEAD:main
